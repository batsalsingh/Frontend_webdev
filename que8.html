<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form</h2>

    <form method="post" action="#">
        <p>Your Feedback:</p>
        <textarea name="feedback" rows="5" cols="40" required></textarea><br><br>

        <p>Rate our service:</p>
        <input type="radio" name="rating" value="Good"> Good
        <input type="radio" name="rating" value="Average"> Average
        <input type="radio" name="rating" value="Poor"> Poor<br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
