<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web Design Layout</title>
  <link rel="stylesheet" href="web-design.css">
</head>
<body>
  <header class="header">
    <div class="logo">MyLogo</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="main">
    <section class="features">
      <div class="feature-box">
        <h2>Feature One</h2>
        <p>Brief description of this amazing feature goes here.</p>
      </div>
      <div class="feature-box">
        <h2>Feature Two</h2>
        <p>Highlight something important and visually appealing.</p>
      </div>
      <div class="feature-box">
        <h2>Feature Three</h2>
        <p>Explain what makes your project unique and helpful.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 Responsive Layout Demo</p>
  </footer>
</body>
</html>
