<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="Tooltip.css">
</head>
<body>
  <header>
    <h1>Tooltip Demonstration</h1>
    <p>Hover over the icons below to see tooltips built using only CSS.</p>
  </header>

  <main>
    <section class="tooltip-container">
     
      <div class="tooltip" data-tooltip="This is a light bulb icon 💡">
        💡
      </div>

 
      <div class="tooltip" data-tooltip="This represents a magnifier 🔍">
        🔍
      </div>

      <div class="tooltip" data-tooltip="This is a heart symbol ❤️">
        ❤️
      </div>

      <div class="tooltip" data-tooltip="This is a star icon ⭐">
        ⭐
      </div>

      <div class="tooltip" data-tooltip="This is a smiley emoji 😊">
        😊
      </div>
    </section>
  </main>
</body>
</html>
