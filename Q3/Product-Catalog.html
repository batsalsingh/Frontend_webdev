<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="text-center py-4 bg-white shadow-sm mb-4">
    <h1 class="fw-bold text-primary">Online Store</h1>
    <p class="text-secondary">Find your perfect products below</p>
  </header>

  <main class="container">
    <div class="row g-4">

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card border-0 shadow-sm h-100 text-center bg-info bg-opacity-25" style="transition: transform 0.4s ease;">
          <img src="https://via.placeholder.com/300" class="card-img-top p-3 rounded" alt="Wireless Headphones" 
               style="aspect-ratio: 1/1; object-fit: cover; transition: transform 0.4s ease;">
          <div class="card-body">
            <h5 class="card-title fw-bold text-info">Wireless Headphones</h5>
            <p class="text-muted mb-2">$49.99</p>
            <a href="#" class="btn btn-outline-info btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card border-0 shadow-sm h-100 text-center bg-success bg-opacity-25" style="transition: transform 0.4s ease;">
          <img src="https://via.placeholder.com/300" class="card-img-top p-3 rounded" alt="Smart Watch"
               style="aspect-ratio: 1/1; object-fit: cover; transition: transform 0.4s ease;">
          <div class="card-body">
            <h5 class="card-title fw-bold text-success">Smart Watch</h5>
            <p class="text-muted mb-2">$79.99</p>
            <a href="#" class="btn btn-outline-success btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card border-0 shadow-sm h-100 text-center bg-warning bg-opacity-25" style="transition: transform 0.4s ease;">
          <img src="https://via.placeholder.com/300" class="card-img-top p-3 rounded" alt="Bluetooth Speaker"
               style="aspect-ratio: 1/1; object-fit: cover; transition: transform 0.4s ease;">
          <div class="card-body">
            <h5 class="card-title fw-bold text-warning">Bluetooth Speaker</h5>
            <p class="text-muted mb-2">$59.99</p>
            <a href="#" class="btn btn-outline-warning btn-sm text-dark">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card border-0 shadow-sm h-100 text-center bg-danger bg-opacity-25" style="transition: transform 0.4s ease;">
          <img src="https://via.placeholder.com/300" class="card-img-top p-3 rounded" alt="Gaming Mouse"
               style="aspect-ratio: 1/1; object-fit: cover; transition: transform 0.4s ease;">
          <div class="card-body">
            <h5 class="card-title fw-bold text-danger">Gaming Mouse</h5>
            <p class="text-muted mb-2">$29.99</p>
            <a href="#" class="btn btn-outline-danger btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center mt-5 py-3 text-secondary">
    © 2025 Online Store | Powered by Bootstrap 5
  </footer>

  <script>
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'scale(1.05)';
        card.style.boxShadow = '0 10px 25px rgba(0,0,0,0.2)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'scale(1)';
        card.style.boxShadow = '';
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
