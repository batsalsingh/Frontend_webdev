<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Showcase (Flexbox)</title>
  <link rel="stylesheet" href="Showcase.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
    <p>Hover over the images to see interactive effects.</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=1" alt="Image 1">
        <figcaption>Mountain Serenity</figcaption>
      </figure>

      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=2" alt="Image 2">
        <figcaption>Urban Lights</figcaption>
      </figure>

      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=3" alt="Image 3">
        <figcaption>Ocean Calm</figcaption>
      </figure>

      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=4" alt="Image 4">
        <figcaption>Desert Trails</figcaption>
      </figure>

      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=5" alt="Image 5">
        <figcaption>Green Escape</figcaption>
      </figure>

      <figure class="image-card">
        <img src="https://picsum.photos/400/250?random=6" alt="Image 6">
        <figcaption>Sunset Reflections</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
