<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Live Character Counter</h2>

    <textarea id="textBox" placeholder="Start typing..." maxlength="100"></textarea>

    <p id="counter">100 characters remaining</p>

    <button id="resetBtn">Reset</button>
  </div>

  <script src="Character-Counter.js"></script>
</body>
</html>
