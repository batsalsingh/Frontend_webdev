<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout — Mountain Summit</title>
  <link rel="stylesheet" href="filter-comp.css">
</head>
<body>
  <header class="header">
    <h1>Before & After — Summit Transformation</h1>
    <p>Experience how subtle filters can enhance the mood of breathtaking mountain scenes.</p>
  </header>

  <main class="comparison-container">
    <section class="image-box before">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1617633784388-f1818619287b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8azIlMjBtb3VudGFpbnxlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000" alt="Mountain Summit Original">
      </div>
      <h2>Before</h2>
    </section>

    <section class="image-box after">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1617633784388-f1818619287b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8azIlMjBtb3VudGFpbnxlbnwwfHwwfHx8MA%3D%3D&fm=jpg&q=60&w=3000" alt="Mountain Summit Filtered">
      </div>
      <h2>After</h2>
    </section>
  </main>
</body>
</html>
