<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <h2>Contact Us</h2>

    <form>
        Full Name: <input type="text" name="fullname" placeholder="Enter your name" required><br><br>
        Email: <input type="email" name="email" placeholder="Enter your email" required><br><br>
        Subject: <input type="text" name="subject" placeholder="Enter subject" required><br><br>
        Message:<br>
        <textarea name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea><br><br>
        <input type="submit" value="Send Message">
    </form>
</body>
</html>
