<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>

    <style>
        body { font-family: Arial; }
        label { display: block; margin-top: 10px; }
        input { padding: 6px; width: 220px; }
        .error { color: red; font-size: 14px; }
        .success { color: green; font-size: 14px; }
        .invalid { border: 2px solid red; }
        .valid { border: 2px solid green; }
        #ticket { margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Movie Ticket Booking</h2>

    <label>Name:</label>
    <input type="text" id="name">
    <small id="nameErr" class="error"></small>

    <label>Email:</label>
    <input type="text" id="email">
    <small id="emailErr" class="error"></small>

    <label>Seats (1 - 10):</label>
    <input type="number" id="seats">
    <small id="seatsErr" class="error"></small>

    <br><br>
    <button id="bookBtn">Book Ticket</button>

    <div id="ticket"></div>

    <script src="movie.js"></script>
</body>
</html>
