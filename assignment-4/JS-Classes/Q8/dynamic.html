<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Object Updater</title>

    <style>
        label { display:block; margin-top:10px; }
        input { padding:5px; width:220px; }
        #result { margin-top:20px; font-size:16px; }
    </style>
</head>
<body>

    <h2>Update User Details</h2>

    <label>Name:</label>
    <input type="text" id="name">

    <label>Email:</label>
    <input type="text" id="email">

    <label>Age:</label>
    <input type="number" id="age">

    <br><br>
    <button id="updateBtn">Update</button>

    <h3>Updated User Object</h3>
    <pre id="result"></pre>

    <script src="dynamic.js"></script>
</body>
</html>
