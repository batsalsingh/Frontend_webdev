<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart System</title>

    <style>
        label { display:block; margin-top:10px; }
        input { padding:5px; width:220px; }
        button { padding:7px 12px; margin-top:10px; }
        #itemsList p { margin:5px 0; }
        #result { margin-top:20px; font-size:16px; }
        .error { color:red; }
        .success { color:green; }
    </style>
</head>
<body>

    <h2>Shopping Cart</h2>

    <h3>Add Item</h3>

    <label>Item Name:</label>
    <input type="text" id="itemName">

    <label>Price:</label>
    <input type="number" id="itemPrice">

    <label>Quantity:</label>
    <input type="number" id="itemQty">

    <button id="addBtn">Add Item</button>

    <h3>Items in Cart</h3>
    <div id="itemsList"></div>

    <hr>

    <h3>Apply Coupon</h3>
    <input type="text" id="coupon" placeholder="SAVE20 / DISC10">
    <small id="couponErr" class="error"></small><br>

    <button id="totalBtn">Calculate Total</button>

    <h3>Final Total</h3>
    <p id="result"></p>

    <script src="cart.js"></script>
</body>
</html>
