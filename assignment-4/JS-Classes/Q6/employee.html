<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
    <style>
        label { display:block; margin-top:10px; }
        input { padding:5px; width: 200px; }
        button { margin-top:15px; padding:8px 12px; }
        #output p { margin:6px 0; }
    </style>
</head>
<body>

    <h2>Employee Management System</h2>

    <label>ID:</label>
    <input type="number" id="empId">

    <label>Name:</label>
    <input type="text" id="empName">

    <label>Department:</label>
    <input type="text" id="empDept">

    <label>Monthly Salary:</label>
    <input type="number" id="empSalary">

    <label>Bonus (%):</label>
    <input type="number" id="empBonus" value="0">

    <button id="addBtn">Add Employee</button>
    <button id="calcBtn">Calculate Total Annual Payout</button>

    <h3>Employees</h3>
    <div id="output"></div>

    <h3>Total Annual Payout</h3>
    <p id="total"></p>

    <script src="employee.js"></script>
</body>
</html>
