<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Highlight</title>

  <style>
    .product {
      border: 1px solid #aaa;
      padding: 15px;
      width: 200px;
      margin: 10px;
      cursor: pointer;
      position: relative;
    }

    .highlight {
      background: lightyellow;
    }

    .details {
      display: none;
      font-size: 14px;
      color: #333;
      margin-top: 8px;
    }

    .favorite {
      font-size: 20px;
      position: absolute;
      top: 5px;
      right: 10px;
      cursor: pointer;
    }

    .selected {
      color: red;
    }

    .product[data-discount="true"] {
      border-color: green;
      background: #e8ffe8;
    }
  </style>
</head>
<body>

  <div class="product" data-stock="in" data-discount="true">
    <h3>Product A</h3>
    <div class="favorite">❤️</div>
    <div class="details">Extra details about Product A</div>
  </div>

  <div class="product" data-stock="out" data-discount="false">
    <h3>Product B</h3>
    <div class="favorite">❤️</div>
    <div class="details">Extra details about Product B</div>
  </div>

  <div class="product" data-stock="in" data-discount="false">
    <h3>Product C</h3>
    <div class="favorite">❤️</div>
    <div class="details">Extra details about Product C</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
