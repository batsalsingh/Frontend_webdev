<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Offer Banners</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .banner {
      width: 350px;
      padding: 15px;
      margin: 10px;
      background: #ffefd5;
      border: 1px solid #ff9800;
      display: block;
      font-size: 18px;
    }

    .controls {
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>
    <button id="slideBtn">Slide Up/Down</button>
    <button id="fadeBtn">Fade In/Out</button>
  </div>

  <div class="banner" id="b1">Special Offer 1: 50% OFF!</div>
  <div class="banner" id="b2">Special Offer 2: Buy 1 Get 1 Free!</div>
  <div class="banner" id="b3">Special Offer 3: Free Shipping Today!</div>

  <script src="script.js"></script>
</body>
</html>
