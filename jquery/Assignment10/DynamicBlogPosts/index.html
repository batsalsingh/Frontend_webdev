<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Blog Posts</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .post {
      padding: 12px;
      border: 1px solid #888;
      margin: 10px 0;
      width: 400px;
    }

    .highlight {
      background: lightyellow;
    }

    #tagInput {
      width: 150px;
    }
  </style>
</head>
<body>

  <h2>Blog Admin Panel</h2>

  <button id="addPost">Add New Post</button>
  <button id="prependPost">Prepend Featured Post</button>
  <button id="removeLast">Remove Last Post</button>

  <br><br>

  <input type="text" id="tagInput" placeholder="Tag name">
  <button id="addTag">Add Tag</button>

  <br><br>

  <input type="text" id="keyword" placeholder="Highlight keyword">
  <button id="highlightBtn">Highlight</button>

  <div id="posts">
    <div class="post">Learning JavaScript Basics</div>
    <div class="post">Advanced CSS Techniques</div>
    <div class="post">How to Master React</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
