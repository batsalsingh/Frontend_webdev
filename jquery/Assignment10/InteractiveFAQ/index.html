<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive FAQ</title>

  <style>
    .faq {
      width: 400px;
      padding: 10px;
      border: 1px solid #aaa;
      margin-bottom: 15px;
    }

    .question {
      font-size: 18px;
      cursor: pointer;
      padding: 5px 0;
    }

    .answer {
      display: none;
      margin-top: 8px;
    }

    .highlight-box {
      background: #fffae6;
    }
  </style>
</head>
<body>

  <div class="faq">
    <div class="question">What is your return policy?</div>
    <div class="answer">
      You can return products within 30 days.
      <br><input type="text" placeholder="Type here">
    </div>
  </div>

  <div class="faq">
    <div class="question">Do you offer free shipping?</div>
    <div class="answer">
      Yes, on orders above ₹499.
      <br><input type="text" placeholder="Type here">
    </div>
  </div>

  <div class="faq">
    <div class="question">How do I track my order?</div>
    <div class="answer">
      You can track it from your dashboard.
      <br><input type="text" placeholder="Type here">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
