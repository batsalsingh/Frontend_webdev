<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="Filter-cards.css">
</head>
<body>
  <main class="card-container">
    <section class="card">
      <img src="https://picsum.photos/300/300?random=1" alt="Profile 1">
      <h2>Akhi</h2>
      <p>Web Designer passionate about clean layouts and creative interfaces.</p>
    </section>
    <section class="card">
      <img src="https://picsum.photos/300/300?random=2" alt="Profile 2">
      <h2>Akshat</h2>
      <p>Frontend Developer who loves smooth animations and responsive design.</p>
    </section>
    <section class="card">
      <img src="https://picsum.photos/300/300?random=3" alt="Profile 3">
      <h2>Tyrant</h2>
      <p>UX Researcher dedicated to crafting meaningful user experiences.</p>
    </section>
  </main>
</body>
</html>
