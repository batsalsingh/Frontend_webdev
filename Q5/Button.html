<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="Button.css">
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
    <p>Explore various button designs with hover, active, focus, and disabled states.</p>
  </header>

  <main class="button-container">
    <button class="btn primary">Primary Button</button>
    <button class="btn secondary">Secondary Button</button>
    <button class="btn outline">Outline Button</button>
    <button class="btn disabled" disabled>Disabled Button</button>
  </main>
</body>
</html>
