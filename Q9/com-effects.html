<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects Demonstration</title>
    <link rel="stylesheet" href="com-effects.css">
</head>
<body>
    <header>
        <h1>Combined Effects Demonstration</h1>
        <p>Hover over the elements below to see combined pseudo-classes, transitions, and transformations in action.</p>
    </header>

    <main>
        <section class="effects-container">
            <div class="effect-box">
                <button class="effect-btn primary">Hover Me</button>
                <p>Button grows and changes color on hover.</p>
            </div>

            <div class="effect-box">
                <button class="effect-btn secondary">Click Me</button>
                <p>Button darkens and rotates slightly on hover.</p>
            </div>

            <div class="effect-box">
                <button class="effect-btn outline">Focus on Me</button>
                <p>Button glows when focused or active.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Combined Effects Demo</p>
    </footer>
</body>
</html>
