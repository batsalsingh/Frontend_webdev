<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Example</title>
</head>
<!-- Using frameset instead of body -->
<frameset rows="30%,70%">
    <frame src="navigation.html" title="Navigation Links">
    <frame src="welcome.html" title="Welcome Message">
</frameset>
</html>
<!DOCTYPE html>
<html>
<head><title>Navigation</title></head>
<body>
    <h3>Navigation Links</h3>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Contact</a>
</body>
</html>
<!DOCTYPE html>
<html>
<head><title>Welcome</title></head>
<body>
    <h2>Welcome to My Website</h2>
</body>
</html>
